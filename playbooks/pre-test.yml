---
- name: Pre integration test play
  hosts: all

  vars:
    zuul_work_dir: "{{ zuul.project.src_dir }}"

  roles:
    - role: ensure-tox
    - role: devstack
      vars:
        # yamllint disable-line rule:line-length
        devstack_services: "keystone nova n-api n-cpu n-cond n-sch n-novnc n-api-meta rabbit placement-api placement-client g-api ovn-controller ovn-northd ovs-vswitchd ovsdb-server q-svc q-ovn-metadata-agent"
        devstack_use_fake_driver: true

  tasks:
    - name: Copy clouds.yml configuration file
      ansible.builtin.copy:
        src: "{{ zuul_work_dir }}/.clouds.yml"
        dest: "{{ zuul_work_dir }}/clouds.yml"
        remote_src: true
        mode: '0644'
        owner: zuul
        group: zuul

    - name: Print openstack CLI version
      ansible.builtin.command: openstack --version
      failed_when: false

    # With the fake virt driver, devstack runs the compute service as host
    # "<hostname>1", but OVN only binds ports on hosts it has a chassis for,
    # and its only chassis is "<hostname>". Name the chassis after the fake
    # compute host so that ports can be bound and servers built.
    - name: Name the OVN chassis after the fake compute host
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          sudo ovs-vsctl set open . "external-ids:hostname=$(hostname)1"
          for i in $(seq 1 30); do
            openstack --os-cloud openstack network agent list \
              --host "$(hostname)1" -f value -c ID | grep -q . && exit 0
            sleep 2
          done
          echo "OVN chassis for $(hostname)1 did not show up" >&2
          exit 1
        chdir: "{{ zuul_work_dir }}"
        executable: /bin/bash
      changed_when: true

    # The devstack has no block storage, so the test runs boot from local
    # disk, which needs a flavor with a root disk.
    - name: Create expected flavor
      # yamllint disable-line rule:line-length
      ansible.builtin.command: openstack --os-cloud openstack flavor create SCS-1V-2-5 --id SCS-1V-2-5 --ram 2048 --vcpus 1 --disk 5
      args:
        chdir: "{{ zuul_work_dir }}"

    - name: Find image file
      ansible.builtin.find:
        paths: "{{ zuul_work_dir }}/devstack/files/"
        file_type: file
        patterns: "*.img"
        recurse: false
      register: find_image
      # yamllint disable-line rule:line-length
      failed_when: (find_image is not defined) or (find_image.files | length == 0)

    - name: Create expected image
      # yamllint disable-line rule:line-length
      ansible.builtin.command: openstack --os-cloud openstack image create "cirros" --file ./devstack/files/{{ find_image.files[0].path | basename }} --disk-format qcow2 --container-format bare --public
      args:
        chdir: "{{ zuul_work_dir }}"
